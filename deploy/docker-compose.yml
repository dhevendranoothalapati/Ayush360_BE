# =====================================================================================================
#  Ayush360: the whole system on one PC, the same way it runs on Azure (minus Key Vault / managed database).
#
#    cd C:\Ayush360\Backend\deploy
#    copy .env.example .env          (set DB_PASSWORD)
#    docker compose up --build
#    open http://localhost:8080      (demo users, password demo123)
#
#  Expects the frontend repo next to the backend: C:\Ayush360\Frontend
#  Services: db (PostgreSQL 18) -> migrate (job) -> identity + hms (APIs) -> web (React + Nginx proxy)
#  Only "web" is published to the host; the APIs are reachable through it at /api/... like in production.
#  ASPNETCORE_ENVIRONMENT=Development here = demo hospitals/users seeded, signing + Aadhaar keys generated
#  (kept in the *-keys volumes). Azure uses Production + Key Vault instead (see docs/deployment-azure.md).
# =====================================================================================================
name: ayush360

x-db-connection: &db-connection "Host=db;Port=5432;Database=ayush360;Username=ayush360_app;Password=${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}"

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ayush360
      POSTGRES_USER: ayush360_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "5433:5432" # pgAdmin from the PC: localhost:5433 (5432 is left for a locally installed PostgreSQL)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayush360_app -d ayush360"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      target: migrator
    environment:
      ConnectionStrings__Default: *db-connection
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  identity:
    build:
      context: ..
      target: identity
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: *db-connection
      DemoData__Enabled: "true"
    volumes:
      - identity-keys:/home/app/.local/share/Ayush360
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  hms:
    build:
      context: ..
      target: hms
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: *db-connection
      DemoData__Enabled: "true"
      # Public keys for checking tokens, straight from the Identity container.
      Jwt__JwksUrl: http://identity:8080/.well-known/jwks.json
      Jwt__RequireHttpsMetadata: "false"
    volumes:
      - hms-keys:/home/app/.local/share/Ayush360
    depends_on:
      migrate:
        condition: service_completed_successfully
      identity:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ../../Frontend
    environment:
      IDENTITY_API_URL: http://identity:8080
      HMS_API_URL: http://hms:8080
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - identity
      - hms
    restart: unless-stopped

volumes:
  db-data:
  identity-keys:
  hms-keys:
