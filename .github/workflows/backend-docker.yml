name: Backend Docker publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create next git tag value
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)

          if [ -z "$LAST_TAG" ]; then
            NEW_TAG="v0.1.0"
          else
            VERSION=${LAST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

  backend-images:
    needs: prepare-release
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.prepare-release.outputs.new_tag }}
      IDENTITY_IMAGE_TAG: ${{ vars.IDENTITY_IMAGE_TAG || needs.prepare-release.outputs.new_tag }}
      HMS_IMAGE_TAG: ${{ vars.HMS_IMAGE_TAG || needs.prepare-release.outputs.new_tag }}
      MIGRATOR_IMAGE_TAG: ${{ vars.MIGRATOR_IMAGE_TAG || needs.prepare-release.outputs.new_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: identity
            image: ayush360-identity
            image_tag_env: IDENTITY_IMAGE_TAG
          - target: hms
            image: ayush360-hms
            image_tag_env: HMS_IMAGE_TAG
          - target: migrator
            image: ayush360-migrator
            image_tag_env: MIGRATOR_IMAGE_TAG

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repository owner
        shell: bash
        run: |
          echo "IMAGE_OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Resolve image tag for ${{ matrix.image }}
        shell: bash
        env:
          TAG_ENV_NAME: ${{ matrix.image_tag_env }}
        run: |
          VALUE="${!TAG_ENV_NAME:-${APP_VERSION}}"
          echo "IMAGE_TAG=${VALUE}" >> "$GITHUB_ENV"

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER_LC }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.IMAGE_OWNER_LC }}/${{ matrix.image }}:latest

  tag-release:
    needs: [prepare-release, backend-images]
    if: ${{ success() && needs.backend-images.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create git tag after successful image publish
        env:
          APP_VERSION: ${{ needs.prepare-release.outputs.new_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "refs/tags/${APP_VERSION}" >/dev/null 2>&1; then
            echo "Tag ${APP_VERSION} already exists; skipping."
            exit 0
          fi

          git tag "${APP_VERSION}"
          git push origin "${APP_VERSION}"
